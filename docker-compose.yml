

services:
  mongodb:
    image: mongo:latest
    container_name: devmentor-db
    ports:
      - "27017:27017"
    volumes:
      - devmentor_data:/data/db

  backend:
    build:
      context: ./backend
    container_name: devmentor-backend
    ports:
      - "5000:5000"
    environment:
      # Use the Docker container name 'mongodb' instead of localhost
      - MONGODB_URI=mongodb://mongodb:27017/devmentor
      - PORT=5000
      - JWT_SECRET=devmentor_secret_key_for_local_development_only
      - GEMINI_API_KEY=${GEMINI_API_KEY}

    depends_on:
      - mongodb
    volumes:
      - ./backend:/app
      - /app/node_modules

  frontend:
    build:
      context: ./frontend
    container_name: devmentor-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend
    volumes:
      - ./frontend:/app
      - /app/node_modules
    # Added environment for Vite to pick up
    environment:
      - CHOKIDAR_USEPOLLING=true
      - VITE_API_URL=http://devmentor-backend:5000

volumes:
  devmentor_data:
